<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carole Zieler's File Browser</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="search-upload-container">
      <label class="visually-hidden" for="search"
        >Search files and folders</label
      >
      <div class="search-field">
        <input
          type="search"
          id="search"
          class="bordered-input"
          placeholder="Search files and folders"
        />
        <button
          id="clear-search"
          class="search-clear"
          type="button"
          aria-label="Clear search"
          hidden
        >
          &times;
        </button>
      </div>
      <label class="visually-hidden" for="upload">Upload a file</label>
      <input type="file" id="upload" class="custom-file-input" />
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th class="size-column">Size</th>
            <th class="hidden-xs">Date Modified</th>
            <th><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr id="search-sentinel" aria-hidden="true">
            <td colspan="4"></td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td
              id="summary"
              colspan="4"
              role="status"
              aria-live="polite"
              aria-atomic="true"
            ></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <dialog
      id="delete-dialog"
      class="delete-dialog"
      aria-labelledby="delete-dialog-title"
      aria-describedby="delete-dialog-message"
    >
      <form method="dialog">
        <h2 id="delete-dialog-title">Delete file?</h2>
        <p id="delete-dialog-message">
          This will permanently delete <strong id="delete-file-name"></strong>.
        </p>
        <div class="dialog-actions">
          <button class="dialog-button" type="submit" value="cancel">
            Cancel
          </button>
          <button class="dialog-button red-btn" type="submit" value="delete">
            Delete file
          </button>
        </div>
      </form>
    </dialog>

    <template id="row-template">
      <tr>
        <td>
          <a class="item-link" data-field="name">
            <svg
              class="file-icon"
              data-icon
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                data-folder-icon
                d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2h8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"
                fill="currentColor"
                hidden
              />
              <path
                data-file-icon
                d="M6 3.5h8l4 4v13H6zM14 3.5v4h4M9 12h6M9 15h6"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.7"
                hidden
              />
            </svg>
            <span data-name></span>
          </a>
        </td>
        <td class="size-column" data-field="size"></td>
        <td class="hidden-xs" data-field="modified"></td>
        <td class="actions-column">
          <button
            class="delete-button"
            type="button"
            data-delete
            aria-label="Delete file"
            title="Delete file"
          >
            <svg class="delete-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 4h8l1 2h4v2H3V6h4zm-2 6h12l-1 11H7zm3-3h6l-.5-1h-5z"
              />
            </svg>
          </button>
        </td>
      </tr>
    </template>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
